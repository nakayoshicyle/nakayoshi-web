<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ネット版ブログ - なかよしさいくる</title>
    <link rel="stylesheet" href="../assets/css/pages-index.css" />
  </head>
  <body>
    <!-- ヘッダーエリア -->
    <!-- ヘッダーエリア -->
    <header>
      <div class="container header-inner">
        <a href="index.html" class="logo">なかよしさいくる</a>

        <!-- ハンバーガーメニューの三本線ボタン -->
        <button class="menu-toggle" id="menuToggle" aria-label="メニューを開く">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- ナビゲーションリンク -->
        <nav class="nav-links" id="navLinks">
          <a href="index.html#notice">ホーム</a>
          <a href="index.html#activity">活動内容</a>
          <a href="index.html#bicycles">自転車について</a>
          <a href="kaihou.html">会報</a>
          <a href="index.html#qa">Q&A</a>
          <a href="index.html#contact" class="btn">入会・お問い合わせ</a>
        </nav>
      </div>
    </header>

    <!-- メインコンテンツエリア -->
    <div class="container main-content">
      <div class="blog-section">
        <div>
          <h1 class="blog-title">ネット版ブログ</h1>
          <p class="blog-status">現在準備中です。しばらくお待ちください。</p>
        </div>
        <div class="blog-aside-text">ネット版のみのブログはこちら</div>
      </div>

      <!-- お問い合わせエリア -->
      <div class="contact-box">
        <div>
          <h3>お問い合せ</h3>
          <p class="contact-desc">
            入会や各種お問い合わせについては<br />公式SNSのDMにてご連絡ください。
          </p>
        </div>
        <ul class="sns-info">
          <li>Twitter: <a href="#">@nakayoshicycle</a></li>
          <li>
            Email: <a href="mailto:support@solus.com">support@solus.com</a>
          </li>
          <li>Instagram: <a href="#">teamnc_utokyo</a></li>
        </ul>
      </div>
    </div>

    <!-- 最下部ネイビーバー -->
    <div class="bottom-bar"></div>
    <!-- ハンバーガーメニュー開閉用のJavaScript -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.getElementById("navLinks");

        // ボタンをクリックした時の開閉処理
        menuToggle.addEventListener("click", function () {
          menuToggle.classList.toggle("active");
          navLinks.classList.toggle("active");
        });

        // メニュー内のリンクをクリックしたら自動でメニューを閉じる（ページ内リンク対策）
        const links = navLinks.querySelectorAll("a");
        links.forEach((link) => {
          link.addEventListener("click", function () {
            menuToggle.classList.remove("active");
            navLinks.classList.remove("active");
          });
        });
      });
    </script>
  </body>
</html>
