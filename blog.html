<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ネット版ブログ - なかよしさいくる</title>
    <style>
      :root {
        --bg-color: #f5f7f8;
        --main-navy: #0e3552;
        --text-dark: #222222;
        --text-muted: #666666;
        --card-bg: #ffffff;
        --font-base:
          "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-base);
        background-color: var(--bg-color);
        color: var(--text-dark);
        line-height: 1.7;
        overflow-x: hidden;
      }

      /* index.htmlと完全に統一したベースコンテナ（左右のセーフエリア） */
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
        width: 100%;
      }

      /* ヘッダー */
      header {
        background-color: var(--bg-color);
        padding: 20px 0;
      }
      .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        color: var(--main-navy);
        font-size: 1.6rem;
        font-weight: 800;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .nav-links a {
        text-decoration: none;
        color: var(--main-navy);
        font-weight: 600;
        font-size: 0.9rem;
      }
      .nav-links .btn {
        color: #ffffff !important;
      }

      /* 共通カプセル型ボタン */
      .btn {
        display: inline-block;
        background-color: var(--main-navy);
        color: #ffffff;
        text-decoration: none;
        padding: 12px 36px;
        border-radius: 50px;
        font-weight: bold;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        text-align: center;
        max-width: 100%;
      }
      .btn:hover {
        opacity: 0.9;
      }

      /* メインコンテンツ枠 */
      .main-content {
        padding: 60px 0 100px 0;
      }

      /* ブログコンテンツエリア */
      .blog-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 80px;
        gap: 40px;
      }
      .blog-title {
        color: var(--main-navy);
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 24px;
      }
      .blog-status {
        color: var(--text-dark);
        font-size: 1rem;
        font-weight: bold;
      }
      /* 右側の薄いテキスト（画像にあった「ネット版のみのブログはこちら」） */
      .blog-aside-text {
        color: #e0e0e0;
        font-size: 1rem;
        font-weight: bold;
        white-space: nowrap;
        padding-top: 12px;
      }

      /* お問い合わせエリア */
      .contact-box {
        display: flex;
        justify-content: space-between;
        padding-top: 40px;
        border-top: 1px solid #dddddd;
        margin-bottom: 40px;
        gap: 40px;
      }
      .contact-box h3 {
        color: var(--main-navy);
        font-size: 1.8rem;
        margin-bottom: 15px;
      }
      .contact-desc {
        color: var(--text-muted);
        font-size: 0.95rem;
      }
      .sns-info {
        list-style: none;
        font-size: 0.9rem;
        font-weight: bold;
      }
      .sns-info li {
        margin-bottom: 8px;
        color: var(--main-navy);
      }
      .sns-info a {
        color: var(--main-navy);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .sns-info a:hover {
        text-decoration: underline;
      }

      /* 最下部ネイビーバー */
      .bottom-bar {
        background-color: var(--main-navy);
        height: 60px;
        width: 100%;
      }

      /* 📱 スマホ・レスポンシブ対応（index.htmlのブレイクポイントと完全同期） */
      @media screen and (max-width: 768px) {
        .container {
          padding: 0 16px !important; /* 横幅が狭くなっても確実に16pxの余白を維持 */
        }
        .main-content {
          padding: 40px 0 60px 0 !important;
        }
        .header-inner,
        .blog-section,
        .contact-box {
          flex-direction: column !important;
          gap: 24px !important;
          align-items: stretch !important;
        }
        .header-inner {
          text-align: center;
        }
        .nav-links {
          flex-wrap: wrap !important;
          justify-content: center !important;
          gap: 12px 16px !important;
        }
        .nav-links a {
          font-size: 0.85rem !important;
        }
        .nav-links .btn {
          width: 100% !important;
          padding: 10px 20px !important;
        }
        .blog-title {
          font-size: 1.8rem !important;
          margin-bottom: 16px !important;
        }
        .blog-aside-text {
          white-space: normal !important;
          padding-top: 0 !important;
        }
      }
      /* --- ハンバーガーメニュー用の基本スタイル --- */
      .menu-toggle {
        display: none; /* パソコン表示ではボタンを隠す */
        background: none;
        border: none;
        cursor: pointer;
        flex-direction: column;
        gap: 6px;
        z-index: 100;
        padding: 10px;
      }
      .menu-toggle span {
        display: block;
        width: 28px;
        height: 3px;
        background-color: var(--main-navy);
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      /* ボタンがクリックされてメニューが開いている時の三本線の変形（X印になる） */
      .menu-toggle.active span:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
      }
      .menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }
      .menu-toggle.active span:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }
      /* 📱 タブレット・スマホ（1024px以下）の時のメニュー挙動 */
      @media screen and (max-width: 1024px) {
        /* 🌟 ここにこれを新しく追加します！ */
        .header-inner {
          flex-direction: row !important;
          justify-content: space-between !important;
          align-items: center !important;
        }

        .menu-toggle {
          display: flex; /* 👈ここからは元々あったコードです */
        }

        .nav-links {
          display: none;
          position: absolute;
          top: 80px;
          left: 0;
          width: 100%;
          background-color: var(--bg-color);
          flex-direction: column !important;
          gap: 0 !important;
          padding: 20px 0;
          box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
          z-index: 99;
        }

        /* JavaScriptで「active」クラスがついたらメニューを展開 */
        .nav-links.active {
          display: flex !important;
        }

        .nav-links a {
          width: 100%;
          text-align: center;
          padding: 16px 0;
          border-bottom: 1px solid rgba(14, 53, 82, 0.1);
          font-size: 1rem !important;
        }

        /* ボタン部分の調整 */
        .nav-links .btn {
          width: 80% !important;
          margin: 15px auto 0 auto !important;
          padding: 12px 0 !important;
          border-bottom: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ヘッダーエリア -->
    <!-- ヘッダーエリア -->
    <header>
      <div class="container header-inner">
        <a href="index.html" class="logo">なかよしさいくる</a>

        <!-- ハンバーガーメニューの三本線ボタン -->
        <button class="menu-toggle" id="menuToggle" aria-label="メニューを開く">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- ナビゲーションリンク -->
        <nav class="nav-links" id="navLinks">
          <a href="index.html#notice">ホーム</a>
          <a href="index.html#activity">活動内容</a>
          <a href="index.html#bicycles">自転車について</a>
          <a href="kaihou.html">会報</a>
          <a href="index.html#qa">Q&A</a>
          <a href="index.html#contact" class="btn">入会・お問い合わせ</a>
        </nav>
      </div>
    </header>

    <!-- メインコンテンツエリア -->
    <div class="container main-content">
      <div class="blog-section">
        <div>
          <h1 class="blog-title">ネット版ブログ</h1>
          <p class="blog-status">現在準備中です。しばらくお待ちください。</p>
        </div>
        <div class="blog-aside-text">ネット版のみのブログはこちら</div>
      </div>

      <!-- お問い合わせエリア -->
      <div class="contact-box">
        <div>
          <h3>お問い合せ</h3>
          <p class="contact-desc">
            入会や各種お問い合わせについては<br />公式SNSのDMにてご連絡ください。
          </p>
        </div>
        <ul class="sns-info">
          <li>Twitter: <a href="#">@nakayoshicycle</a></li>
          <li>
            Email: <a href="mailto:support@solus.com">support@solus.com</a>
          </li>
          <li>Instagram: <a href="#">teamnc_utokyo</a></li>
        </ul>
      </div>
    </div>

    <!-- 最下部ネイビーバー -->
    <div class="bottom-bar"></div>
    <!-- ハンバーガーメニュー開閉用のJavaScript -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.getElementById("navLinks");

        // ボタンをクリックした時の開閉処理
        menuToggle.addEventListener("click", function () {
          menuToggle.classList.toggle("active");
          navLinks.classList.toggle("active");
        });

        // メニュー内のリンクをクリックしたら自動でメニューを閉じる（ページ内リンク対策）
        const links = navLinks.querySelectorAll("a");
        links.forEach((link) => {
          link.addEventListener("click", function () {
            menuToggle.classList.remove("active");
            navLinks.classList.remove("active");
          });
        });
      });
    </script>
  </body>
</html>
